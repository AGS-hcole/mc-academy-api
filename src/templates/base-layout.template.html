<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>{{title}}</title>
    <style type="text/css">
      /* Reset styles */
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      img {
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
        -ms-interpolation-mode: bicubic;
      }

      table {
        border-collapse: collapse !important;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }

      /* My Center Academy Brand Colors */
      .brand-primary {
        color: #1e293b;
      } /* Blue primary */
      .brand-secondary {
        color: #34a853;
      } /* Green secondary */
      .brand-accent {
        color: #ea4335;
      } /* Red accent */
      .brand-dark {
        color: #202124;
      } /* Dark text */
      .brand-light {
        color: #5f6368;
      } /* Light text */

      /* Responsive styles */
      @media only screen and (max-width: 600px) {
        .email-container {
          width: 100% !important;
          margin: auto !important;
        }

        .stack-column,
        .stack-column-center {
          display: block !important;
          width: 100% !important;
          max-width: 100% !important;
          direction: ltr !important;
        }

        .center-on-narrow {
          text-align: center !important;
          display: block !important;
          margin-left: auto !important;
          margin-right: auto !important;
          float: none !important;
        }

        table.center-on-narrow {
          display: inline-block !important;
        }

        .button-td,
        .button-a {
          width: 100% !important;
        }

        .mobile-padding {
          padding: 20px !important;
        }

        .mobile-hide {
          display: none !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif;
    "
  >
    <center style="width: 100%; background-color: #f4f4f4">
      <!-- Preheader (hidden) -->
      <div
        style="
          display: none;
          font-size: 1px;
          line-height: 1px;
          max-height: 0px;
          max-width: 0px;
          opacity: 0;
          overflow: hidden;
          mso-hide: all;
          font-family: sans-serif;
        "
      >
        {{preheader}}
      </div>

      <!-- Email Container -->
      <table
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
        align="center"
        width="100%"
        style="margin: auto; max-width: 600px"
        class="email-container"
      >
        <!-- Header with Logo -->
        <tr>
          <td
            style="
              padding: 40px 20px 20px 20px;
              text-align: center;
              background: linear-gradient(135deg, #1e293b 0%, #1e293b 100%);
            "
          >
            <table
              role="presentation"
              cellspacing="0"
              cellpadding="0"
              border="0"
              width="100%"
            >
              <tr>
                <td style="text-align: center">
                  <h1
                    style="
                      margin: 0;
                      font-size: 32px;
                      line-height: 40px;
                      color: #ffffff;
                      font-weight: 700;
                      letter-spacing: -0.5px;
                    "
                  >
                    My Center Academy
                  </h1>
                  <p
                    style="
                      margin: 10px 0 0 0;
                      font-size: 14px;
                      line-height: 20px;
                      color: rgba(255, 255, 255, 0.9);
                    "
                  >
                    Ecole de Padel et de Tennis d'Excellence
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Main Content -->
        <tr>
          <td style="background-color: #ffffff">
            <table
              role="presentation"
              cellspacing="0"
              cellpadding="0"
              border="0"
              width="100%"
            >
              <tr>
                <td style="padding: 40px 30px" class="mobile-padding">
                  {{content}}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td
            style="padding: 30px; background-color: #f9f9f9; text-align: center"
          >
            <table
              role="presentation"
              cellspacing="0"
              cellpadding="0"
              border="0"
              width="100%"
            >
              <tr>
                <td style="padding-bottom: 15px">
                  <p
                    style="
                      margin: 0;
                      font-size: 14px;
                      line-height: 20px;
                      color: #5f6368;
                    "
                  >
                    <strong style="color: #202124">My Center Academy</strong
                    ><br />
                    Votre académie de tennis d'excellence
                  </p>
                </td>
              </tr>
              <tr>
                <td style="padding-top: 15px; border-top: 1px solid #e0e0e0">
                  <p
                    style="
                      margin: 0;
                      font-size: 12px;
                      line-height: 18px;
                      color: #5f6368;
                    "
                  >
                    Vous recevez cet email car vous êtes membre de My Center
                    Academy.<br />
                    © {{year}} My Center Academy. Tous droits réservés.
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </center>
  </body>
</html>
