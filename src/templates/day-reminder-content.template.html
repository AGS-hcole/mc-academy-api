<!-- Reminder Icon -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
  <tr>
    <td style="text-align: center; padding-bottom: 30px;">
      <div style="font-size: 60px; line-height: 1;">⏰</div>
    </td>
  </tr>
</table>

<!-- Title -->
<h2 style="margin: 0 0 20px 0; font-size: 28px; line-height: 36px; color: #202124; font-weight: 700; text-align: center;">
  Rappel de séance
</h2>

<p style="margin: 0 0 20px 0; font-size: 16px; line-height: 24px; color: #5f6368;">
  Bonjour {{firstname}},
</p>

<p style="margin: 0 0 30px 0; font-size: 16px; line-height: 24px; color: #5f6368;">
  Rappel : tu es inscrit(e) à :
</p>

<!-- Session Info -->
<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="margin-bottom: 30px; background-color: #f8f9fa; border-radius: 8px; border-left: 4px solid #34a853;">
  <tr>
    <td style="padding: 20px;">
      <div style="font-size: 18px; line-height: 28px; color: #202124; font-weight: 600;">
        {{session}}
      </div>
    </td>
  </tr>
</table>

<!-- Encouragement -->
<p style="margin: 0 0 10px 0; font-size: 18px; line-height: 24px; color: #202124; font-weight: 600; text-align: center;">
  À tout à l'heure ! 🎾
</p>

<p style="margin: 0; font-size: 14px; line-height: 20px; color: #5f6368; text-align: center;">
  N'oublie pas ton équipement et ta bonne humeur !
</p>
